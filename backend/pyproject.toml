[project]
name = "aether-backend"
version = "0.1.0"
description = "Backend for Aether Messenger"
authors = [
    { name = "hypeoman", email = "novikov.s.mtkp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
] 

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
